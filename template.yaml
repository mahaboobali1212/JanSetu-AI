AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  JanSetu AI - Serverless Architecture for Bharat Builds Tour (WeMakeDevs x AWS)
  Compatible with AWS SAM CLI, LocalStack, and AWS Cloud.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x
    Environment:
      Variables:
        SCHEMES_TABLE: !Ref SchemesTable
        DOSSIERS_TABLE: !Ref DossiersTable
        BEDROCK_REGION: us-east-1
        BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0

Resources:
  # ============================================================================
  # API GATEWAY
  # ============================================================================
  JanSetuApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

  # ============================================================================
  # SERVERLESS FUNCTIONS (LAMBDA)
  # ============================================================================
  CedarPolicyEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api/evaluate.handler
      Description: Deterministic AWS Cedar-based policy evaluator for Indian citizen schemes
      Events:
        EvaluateApi:
          Type: Api
          Properties:
            RestApiId: !Ref JanSetuApi
            Path: /evaluate
            Method: post

  BedrockAssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api/chat.handler
      Description: Amazon Bedrock multilingual conversational copilot with RAG
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        ChatApi:
          Type: Api
          Properties:
            RestApiId: !Ref JanSetuApi
            Path: /chat
            Method: post

  DocumentAuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api/audit.handler
      Description: Pre-flight document discrepancy and NPCI bank seeding verifier
      Events:
        AuditApi:
          Type: Api
          Properties:
            RestApiId: !Ref JanSetuApi
            Path: /audit-documents
            Method: post

  TextractOcrFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api/textract.handler
      Description: Amazon Textract Key-Value and Table Extractor for Indian Citizen Documents
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
                - textract:DetectDocumentText
              Resource: "*"
      Events:
        TextractApi:
          Type: Api
          Properties:
            RestApiId: !Ref JanSetuApi
            Path: /ocr-extract
            Method: post

  PollyVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api/polly.handler
      Description: Amazon Polly Neural Indian Vernacular Speech Synthesizer (Aditi & Kajal)
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: "*"
      Events:
        PollyApi:
          Type: Api
          Properties:
            RestApiId: !Ref JanSetuApi
            Path: /synthesize-speech
            Method: post

  # ============================================================================
  # AWS STEP FUNCTIONS (STATUTORY RTI & GRIEVANCE 30-DAY SLA STATE MACHINE)
  # ============================================================================
  RtiEscalationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Definition:
        StartAt: PetitionSubmitted
        States:
          PetitionSubmitted:
            Type: Pass
            Result: "Statutory Filing Acknowledged"
            Next: WaitForDay15Audit
          WaitForDay15Audit:
            Type: Wait
            Seconds: 1296000 # 15 Days
            Next: SendIntermediateNotice
          SendIntermediateNotice:
            Type: Task
            Resource: "arn:aws:states:::sns:publish"
            Parameters:
              TopicArn: !Ref DeadlineAlertTopic
              Message: "Statutory SLA Alert: 15 days remaining before Section 20 Officer Penalty triggers."
            Next: WaitForDay30Expiry
          WaitForDay30Expiry:
            Type: Wait
            Seconds: 1296000 # 15 Days (Total 30 Days)
            Next: TriggerFirstAppealWithPenalty
          TriggerFirstAppealWithPenalty:
            Type: Pass
            Result: "First Appeal Initiated with Rs 250/day Statutory Penalty Computation"
            End: true
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref DeadlineAlertTopic

  # ============================================================================
  # AMAZON SNS (CITIZEN DEADLINE & RTI SMS ALERT TOPIC)
  # ============================================================================
  DeadlineAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: JanSetuCitizenAlerts
      DisplayName: "JanSetu AI Citizen Deadline & RTI Alerts"

  # ============================================================================
  # DYNAMODB TABLES (SCALES TO ZERO)
  # ============================================================================
  SchemesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JanSetuSchemes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CategoryIndex
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  DossiersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JanSetuDossiers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dossierId
          AttributeType: S
      KeySchema:
        - AttributeName: dossierId
          KeyType: HASH

  # ============================================================================
  # S3 STORAGE (DOCUMENT TEMPLATES & FORMS)
  # ============================================================================
  DocumentTemplatesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub jansetu-templates-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL for JanSetu AI
    Value: !Sub "https://${JanSetuApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  SchemesTableName:
    Description: DynamoDB Table Name for Schemes
    Value: !Ref SchemesTable
  DeadlineAlertTopicArn:
    Description: SNS Topic for Citizen Deadline & RTI Alerts
    Value: !Ref DeadlineAlertTopic
